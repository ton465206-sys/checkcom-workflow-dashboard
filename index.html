<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ເຊັກຄອມ | ศูนย์งาน</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Segoe UI,"Noto Sans Lao",sans-serif;background:#f3f7f8;color:#14282d}
    header{background:#123840;color:white;padding:24px clamp(20px,4vw,56px)}h1{margin:0;font-size:1.8rem}header p{margin:5px 0 0;color:#bed5d8}
    nav{display:flex;gap:10px;flex-wrap:wrap;padding:18px clamp(20px,4vw,56px);background:white;border-bottom:1px solid #d7e3e5}
    button{border:1px solid #b9ced1;border-radius:10px;background:white;color:#16444d;padding:11px 16px;font:inherit;cursor:pointer}
    button[aria-selected=true]{background:#126b76;color:white;border-color:#126b76}button:focus-visible{outline:3px solid #e3a831;outline-offset:2px}
    main{padding:18px clamp(20px,4vw,56px)}.intro{margin:0 0 12px;color:#47656b}.frame{width:100%;height:calc(100vh - 222px);min-height:520px;border:1px solid #d2e0e2;border-radius:12px;background:white}
    .frame[hidden]{display:none}.assistant{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 14px}.assistant input{flex:1;min-width:220px;padding:11px;border:1px solid #b9ced1;border-radius:10px;font:inherit}.assistant select{padding:11px;border:1px solid #b9ced1;border-radius:10px}.voice-result{min-height:24px;margin:0 0 10px;color:#16444d}.tasks{background:#fff;border:1px solid #d2e0e2;border-radius:12px;padding:14px;margin-bottom:14px}.tasks[hidden]{display:none}.tasks ul{margin:8px 0;padding-left:22px}.tasks li{padding:4px 0}.tasks h2{font-size:1.1rem;margin:0}.confirm{background:#fff4d8;border:1px solid #d9ac51;padding:10px;border-radius:9px;margin-bottom:10px}.confirm[hidden]{display:none}
  </style>
</head>
<body>
  <header><h1>ເຊັກຄອມ</h1><p>ศูนย์รวม Workflow และ Dashboard</p></header>
  <nav aria-label="เลือกส่วนงาน">
    <button type="button" data-page="workflow" aria-selected="true">Workflow แผนก</button>
    <button type="button" data-page="sales" aria-selected="false">Dashboard ทีมขาย</button>
  </nav>
  <main>
    <p class="intro" id="description">ภาพรวมขั้นตอนงานและ KPI รายแผนก</p>
    <form class="assistant" id="command-form"><button type="button" id="mic">🎙 พูดสั่งงาน</button><select id="speech-language" aria-label="ภาษาคำสั่งเสียง"><option value="th-TH">ไทย</option><option value="lo-LA">ลาว</option></select><input id="command" aria-label="คำสั่ง" placeholder="เช่น เพิ่มงาน โทรหาลูกค้า / ค้นงาน ลูกค้า / สรุปงาน"><button type="submit">สั่งงาน</button></form>
    <p class="voice-result" id="voice-result" role="status"></p>
    <div class="confirm" id="confirm" hidden><span id="confirm-text"></span> <button type="button" id="confirm-yes">ยืนยัน</button><button type="button" id="confirm-no">ยกเลิก</button></div>
    <section class="tasks" id="tasks" hidden><h2>งานที่สั่งผ่านผู้ช่วย</h2><ul id="task-list"></ul></section>
    <iframe class="frame" id="workflow" title="Workflow แผนก" src="apps/workflow/index.html"></iframe>
    <iframe class="frame" id="sales" title="Dashboard ทีมขาย" src="apps/sales/index.html" hidden></iframe>
  </main>
  <script>
    const pages={
      workflow:{description:'ภาพรวมขั้นตอนงานและ KPI รายแผนก'},
      sales:{description:'งานมอบหมาย ลูกค้า และ KPI ของทีมขาย Mungmee IT'}
    };
    const description=document.getElementById('description');
    function show(page){page=pages[page]?page:'workflow';description.textContent=pages[page].description;document.querySelectorAll('main iframe').forEach(frame=>frame.hidden=frame.id!==page);document.querySelectorAll('nav button').forEach(button=>button.setAttribute('aria-selected',button.dataset.page===page));location.hash=page;}
    document.querySelectorAll('nav button').forEach(button=>button.addEventListener('click',()=>show(button.dataset.page)));
    if(pages[location.hash.slice(1)])show(location.hash.slice(1));
  </script>
  <script src="assistant.js"></script>
</body>
</html>
